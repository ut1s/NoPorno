<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoPorno Redirect</title>
    <link rel="stylesheet" href="redirect.css" />
    <script src="goodsites.js"></script>
    <script src="redirect.js" defer></script>
  </head>
  <body>
    <main class="warning-shell">
      <section class="warning-card" aria-live="polite">
        <p class="badge">NoPorno</p>
        <h1>This site is blocked.</h1>
        <p class="description">
          You are being redirected to a healthier destination.
        </p>
        <p id="blocked-domain" class="blocked-domain" hidden></p>

        <div class="countdown-wrap">
          <p id="countdown-text" class="countdown">Redirecting in 3 seconds...</p>
          <button id="redirect-now-btn" type="button">Redirect now</button>
        </div>

        <p id="status-text" class="status"></p>
      </section>
    </main>
  </body>
</html>
