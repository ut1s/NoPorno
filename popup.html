<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoPorno</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="header-card">
        <h1>NoPorno</h1>
        <p>Supportive redirection for better focus.</p>
      </header>

      <section class="card">
        <div class="row-between">
          <span class="label">Protection</span>
          <label class="switch" aria-label="Enable extension">
            <input id="enabled-toggle" type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>
        <p id="toggle-caption" class="muted">Enabled</p>
      </section>

      <section class="card">
        <p class="label">Stats</p>
        <p id="stats-text" class="stats-text">Redirected 0 times today / 0 times this week</p>
      </section>

      <section class="card">
        <label class="label" for="domain-input">Quick-add blocked domain</label>
        <div class="quick-add-row">
          <input id="domain-input" type="text" placeholder="example.com" autocomplete="off" />
          <button id="add-domain-btn" type="button">Add</button>
        </div>
        <p id="quick-add-status" class="status" aria-live="polite"></p>
      </section>

      <section id="warning-card" class="card warning" hidden>
        <p class="label">Rule warning</p>
        <p id="warning-text"></p>
      </section>

      <button id="open-settings-btn" class="settings-btn" type="button">
        Open settings
      </button>
    </main>
  </body>
</html>
